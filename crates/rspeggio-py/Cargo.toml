[package]
name = "rspeggio-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "rspeggio"
crate-type = ["cdylib", "rlib"]

[dependencies]
pdbtbx = "0.12"
pyo3 = { version = "0.29", features = ["extension-module"] }
rspeggio-ccd = { path = "../rspeggio-ccd" }
rspeggio-core = { path = "../rspeggio-core" }
serde_json = "1"
